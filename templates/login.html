<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connection - Clicker Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-purple-500 to-indigo-600 h-screen flex items-center justify-center">
    <form action="" method="POST" class="bg-white p-6 rounded-2xl shadow-xl">
        <h2 class="text-2xl font-bold mb-4 text-center">Connection</h2>
        <label>
            <input type="text" name="username" placeholder="Username" required
                   class="w-full p-2 border rounded mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </label>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 transition">
            Enter
        </button>
    </form>
</body>
</html>
